name: android

# Builds the native Android client in android/.
#
# Release signing (optional) - repository secrets:
#   SDS200_KEYSTORE_B64       base64 of the release keystore (.jks), e.g. `base64 -w0 release.jks`
#   SDS200_KEYSTORE_PASSWORD  keystore (store) password
#   SDS200_KEY_ALIAS          key alias inside the keystore
#   SDS200_KEY_PASSWORD       key password (defaults to the store password if empty)
# Without them the release APK is signed with the runner's debug key: installable,
# but each runner has a different debug key, so updates may need an uninstall first.

# No paths filter on push: GitHub ANDs path filters with the ref filter, so a
# v* tag on a commit that did not touch android/ would be skipped and the
# release would go out without an APK.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest image ships the Android SDK and cmdline-tools already;
      # android-actions/setup-android@v3 fails on it ("Failed to find package
      # 'tools'"), so install only what is missing with the bundled sdkmanager.
      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Provide Gradle from the action's own (cached, retried) download rather
      # than the wrapper: the wrapper's fetch from the GitHub release CDN has
      # returned 504 and timed out on the runner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.9.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version $V (code $GITHUB_RUN_NUMBER)"

      - name: Unit tests, lint and release build
        env:
          SDS200_KEYSTORE_B64: ${{ secrets.SDS200_KEYSTORE_B64 }}
          SDS200_KEYSTORE_PASSWORD: ${{ secrets.SDS200_KEYSTORE_PASSWORD }}
          SDS200_KEY_ALIAS: ${{ secrets.SDS200_KEY_ALIAS }}
          SDS200_KEY_PASSWORD: ${{ secrets.SDS200_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest lint assembleRelease

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          ls -l *.apk
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SDS200-Remote-${{ env.APP_VERSION }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SDS200-Remote-*
          path: dist
          merge-multiple: true
      - name: Rename checksum file
        run: mv dist/SHA256SUMS.txt dist/SDS200-Remote-SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SDS200-Remote-SHA256SUMS.txt
          fail_on_unmatched_files: true
