  espressif/esp_lcd_jd9365: "^2.0.2"
  espressif/esp_lcd_touch: "^1.1.2"
  mangoo1/esp_lcd_touch_gsl3680: "^1.0.0"
  espressif/esp_codec_dev: "~1.3.4"
  espressif/esp_hosted:
